<!doctype html>
<html>
    <head>
        <title id="tab-title">Ristorante</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="icon" href="img/icona.png" type="image/png">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <script src="lib.js"></script>
    </head>

    <body onload="caricaDettagliRistorante(); caricaMenu(); aggiornaBadge();" data-bs-theme="dark">
        <!-- navbar -->
        <nav class="navbar bg-light-subtle navbar-expand-md sticky-top" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="img/icona.png" alt="Bootstrap" width="30" height="24">
                    DomiCibo
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="index.html">
                                <i class="bi bi-house"></i>
                                Home
                            </a>
                        </li>
                    </ul>

                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="utente.html">
                                <i class="bi bi-person"></i>
                                Utente
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="carrello.html">
                                <i class="bi bi-cart3"></i>
                                Carrello

                                <span id="badge-carrello" class="badge rounded-pill bg-danger">0</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container my-3">
            <div class="row">
                <div class="col-lg-3">
                    <img id="poster" class="img-fluid d-flex mx-auto rounded mb-3" src="" style="width: 18rem;">
                </div>

                <div class="col-lg-9">
                    <h5 id="nome-ristorante" class="fs-5"></h5>

                    <div>
                        <div class="my-2">
                            <h6 id="media-recensioni" class="text-warning"></h6>
                        </div>

                        <div class="my-2">
                            <small>
                                <span id="indirizzo"></span>
                                <br>
                                <span id="coordinate"></span>
                            </small>
                        </div>

                        <div class="my-2">
                            <small id="telefono"></small>
                        </div>

                        <div class="my-2">
                            <small id="email"></small>
                        </div>

                        <div class="my-2">
                            <small id="piva"></small>
                        </div>
                    </div>

                    <div id="descrizione" class="my-2"></div>
                </div>
            </div>

            <div class="modal fade" id="ricetta" tabindex="-1">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="ricettaTitle"></h5>

                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body" id="ricettaBody"></div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Chiudi
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <h5 class="fs-5">Prodotti</h5>

            <div class="row my-3">
                <div class="col-lg-4">
                    <div class="input-group mb-1">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>

                        <input type="text" id="ricerca" class="form-control" placeholder="Cerca un piatto..." oninput="cercaMenu()">
                    </div>
                </div>

                <div class="col-lg-3">
                    <select id="categoria" class="form-select mb-1" onchange="cercaMenu()">
                        <option value="">
                            Tutte le categorie
                        </option>
                        <option value="Beef">
                            Beef
                        </option>
                        <option value="Breakfast">
                            Breakfast
                        </option>
                        <option value="Chicken">
                            Chicken
                        </option>
                        <option value="Dessert">
                            Dessert
                        </option>
                        <option value="Goat">
                            Goat
                        </option>
                        <option value="Lamb">
                            Lamb
                        </option>
                        <option value="Miscellaneous">
                            Miscellaneous
                        </option>
                        <option value="Pasta">
                            Pasta
                        </option>
                        <option value="Pork">
                            Pork
                        </option>
                        <option value="Seafood">
                            Seafood
                        </option>
                        <option value="Side">
                            Side
                        </option>
                        <option value="Starter">
                            Starter
                        </option>
                        <option value="Vegan">
                            Vegan
                        </option>
                        <option value="Vegetarian">
                            Vegetarian
                        </option>
                    </select>
                </div>
            </div>

            <div id="container-prodotto" class="row row-cols-2 g-3">
                
                <!-- Modello carta prodotto -->
                <div id="prodotto" class="col d-none">

                    <div class="card h-100" style="max-width: 100%;">
                        <div class="row g-0">

                            <div class="col-lg-4">
                                <img id="foto-prodotto" class="img-fluid rounded">
                            </div>
                            
                            <div class="col-lg-8">
                                <div class="card-body">
                                    <h5 id="nome-prodotto" class="card-title text-dark-emphasis fs-6"></h5>

                                    <div class="card-text text-body-secondary mb-3">
                                        <small id="categoria-prodotto"></small>
                                        
                                        <br>
                                        
                                        <small id="area-prodotto"></small>
                                        
                                        <br>
                                        
                                        <span id="prezzo-prodotto" class="text-primary fw-bold"></span>
                                    </div>

                                    <button type="button" class="btn btn-secondary btn-sm" style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;" onclick="apriRicetta(this)">
                                        <i class="bi bi-info-circle"></i>
                                    </button>
                                    
                                    <button type="button" class="btn btn-primary" style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">
                                        <i class="bi bi-plus-lg"></i>
                                        Aggiungi al carrello
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>

            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
<html>
