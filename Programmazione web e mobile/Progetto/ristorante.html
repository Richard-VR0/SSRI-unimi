<!doctype html>
<html>
    <head>
        <title id="tab-title">Ristorante</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="icon" href="img/icona.png" type="image/png">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <script src="lib.js"></script>
        <script src="meals.js"></script>
    </head>

    <body onload="caricaDettagliRistorante(); caricaProdotti();" data-bs-theme="dark">
        <!-- navbar -->
        <nav class="navbar bg-light-subtle navbar-expand-md sticky-top" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="img/icona.png" alt="Bootstrap" width="30" height="24">
                    DomiCibo
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="index.html">
                                <i class="bi bi-house"></i>
                                Home
                            </a>
                        </li>
                    </ul>

                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="utente.html">
                                <i class="bi bi-person"></i>
                                Utente
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="swagger.html">
                                <i class="bi bi-cart3"></i>
                                Carrello
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container my-3">
            <div class="row">
                <div class="col-lg-3">
                    <img id="poster" class="img-fluid d-flex mx-auto rounded mb-3" src="" style="width: 18rem;">
                </div>

                <div class="col-lg-9">
                    <h5 id="nome-ristorante" class="fs-5"></h5>

                    <div class="my-2">
                        <small class="text-warning">
                            <span id="indirizzo"></span>
                            <br>
                            <span id="coordinate"></span>
                        </small>
                    </div>

                    <div class="my-2">
                        <small id="telefono" class="text-warning"></small>
                    </div>

                    <div class="my-2">
                        <small id="email" class="text-warning"></small>
                    </div>

                    <div class="my-2">
                        <small id="piva" class="text-warning"></small>
                    </div>

                    <div id="descrizione" class="my-2"></div>
                </div>
            </div>

            <h5 class="fs-5">Prodotti</h5>

            <div class="row my-3">
                <div class="col-lg-4">
                    <div class="input-group flex-nowrap">
                        <span class="input-group-text" id="addon-wrapping">Cerca</span>
                        <input type="text" id="ricerca" class="form-control" placeholder="Cerca qualcosa..." aria-label="Username" aria-describedby="addon-wrapping" oninput="cercaRistoranti();">
                    </div>
                </div>
            </div>

            <div class="row row-cols-2 g-3">
                
                <!-- Modello carta prodotto -->
                <div id="prodotto" class="col d-none">
                    <div class="card h-100" style="max-width: 100%;">
                        <div class="row g-0">

                            <div class="col-lg-4">
                                <img src="" class="img-fluid rounded">
                            </div>
                            
                            <div class="col-lg-8">
                                <div class="card-body">
                                    <h5 class="card-title text-dark-emphasis fs-6"></h5>

                                    <div class="card-text text-body-secondary mb-3">
                                        <small></small>
                                    </div>
                                    
                                    <button type="button" class="btn btn-primary" style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">
                                        <i class="bi bi-plus-lg"></i>
                                        Aggiungi al carrello
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
<html>
