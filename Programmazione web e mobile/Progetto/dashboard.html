<!doctype html>

    </head>

    <body onload="dashboard();" data-bs-theme="dark">

            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="img/icona.png" alt="Bootstrap" width="30" height="24">
                    DomiCibo
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="index.html">
                                <i class="bi bi-house"></i>
                                Home
                            </a>
                        </li>
                    </ul>

                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="utente.html">
                                <i class="bi bi-person-fill"></i>
                                Utente
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="swagger.html">
                                <i class="bi bi-cart3"></i>
                                Carrello
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container">
            <h5 class="fs-4 text-center my-3">
                Dashboard
            </h5>

            <div class="bg-light-subtle rounded py-3">
                <h5 class="fs-5 text-center">
                    <i class="bi bi-fork-knife"></i>
                    Menu
                </h5>

                <div class="accordion accordion-flush m-3 rounded">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseOne" aria-expanded="false" aria-controls="flush-collapseOne">
                                Gestione menu
                            </button>
                        </h2>

                        <div id="flush-collapseOne" class="accordion-collapse collapse p-3">

                            <div id="container-piatto" class="row g-3">
                                <div id="piatto" class="col d-none">

                                    <div class="card mx-auto h-100" style="width: 13rem;">
                                        <label for="checkpiatto">
                                            <img class="img-thumbnail">
                                        </label>

                                        <div class="card-body text-center">

                                            <label class="form-check-label" for="checkpiatto"></label>

                                            <br>

                                            <input id="checkpiatto" class="form-check-input" type="checkbox">

                                            <div class="input-group mt-3">
                                                <span class="input-group-text">
                                                    Prezzo
                                                </span>

                                                <input type="text" class="form-control">
                                            </div>

                                        </div>
                                    </div>

                                </div>
                            </div>

                            <div class="row g-3">
                                <div class="col">
                                    <button type="button" class="btn btn-primary d-flex mx-auto mt-3" onclick="aggiornaMenu();">
                                        <i class="bi bi-arrow-clockwise"></i>
                                        Aggiorna menu
                                    </button>
                                </div>
                            </div>

                        </div>

                    </div>
