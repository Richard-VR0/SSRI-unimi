<!doctype html>
<html>
    <head>
        <title>Dashboard</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="icon" href="img/icona.png" type="image/png">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <script src="lib.js"></script>
    </head>

    <body onload="controlloRistorante();" data-bs-theme="dark">
        <!-- navbar -->
        <nav class="navbar bg-light-subtle navbar-expand-md sticky-top" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="img/icona.png" alt="Bootstrap" width="30" height="24">
                    DomiCibo
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="index.html">
                                <i class="bi bi-house"></i>
                                Home
                            </a>
                        </li>
                    </ul>

                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="utente.html">
                                <i class="bi bi-person"></i>
                                Utente
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="carrello.html">
                                <i class="bi bi-cart3"></i>
                                Carrello
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container">
            <h5 class="fs-4 text-center my-3">
                Dashboard
            </h5>

            <div class="bg-light-subtle rounded py-3 mb-3">
                <h5 class="fs-5 text-center">
                    <i class="bi bi-fork-knife"></i>
                    Gestione menu
                </h5>

                <div class="accordion accordion-flush m-3 rounded">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseOne" aria-expanded="false" aria-controls="flush-collapseOne">
                                Lista piatti
                            </button>
                        </h2>

                        <div id="flush-collapseOne" class="accordion-collapse collapse p-3">

                            <div id="container-piatto" class="row g-3">

                                <!-- Modello carta prodotto -->
                                <div id="piatto" class="col d-none">

                                    <div class="card mx-auto h-100" style="width: 13rem;">
                                        <label id="label-foto-prodotto" for="checkpiatto">
                                            <img id="foto-prodotto" class="img-thumbnail">
                                        </label>

                                        <div class="card-body text-center">

                                            <label id="nome-prodotto" class="form-check-label" for="checkpiatto"></label>

                                            <br>

                                            <input id="checkpiatto" class="form-check-input" type="checkbox">

                                            <div class="input-group mt-3">
                                                <span class="input-group-text">
                                                    Prezzo
                                                </span>

                                                <input type="text" id="prezzo-piatto" class="form-control" min="0" step="0.01">
                                            </div>

                                        </div>
                                    </div>

                                </div>
                            </div>

                            <div class="row g-3">
                                <div class="col">
                                    <button type="button" class="btn btn-success d-flex mx-auto mt-3" onclick="aggiornaMenu();">
                                        <i class="bi bi-arrow-clockwise"></i>
                                        Aggiorna menu
                                    </button>
                                </div>
                            </div>

                        </div>

                    </div>
                </div>
                
            </div>

            <div class="bg-light-subtle rounded py-3 mb-3">
                <h5 class="fs-5 text-center mb-3">
                    <i class="bi bi-border-width"></i>
                    Gestione ordini
                </h5>

                <div id="nessun-ordine" class="d-none">
                    <p class="text-muted text-center">
                        Non hai ancora ricevuto ordini
                    </p>
                </div>

                <div id="container-ordine" class="row g-3 px-3">
                    
                    <!-- Modello carta ordine -->
                    <div id="ordine" class="col-12 d-none">

                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span class="fw-bold" id="nome-cliente-ordine"></span>
                                
                                <span class="badge" id="stato-ordine"></span>
                            </div>

                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-8">
                                        <p class="card-text" id="piatti-ordine"></p>
                                    </div>
                                    
                                    <div class="col-md-4 text-end">
                                        <h5 class="text-primary fw-bold" id="totale-ordine"></h5>

                                        <small class="text-body-secondary" id="data-ordine"></small>

                                        <br>

                                        <button class="btn btn-primary btn-sm mt-2 btn-avanza">
                                            <i class="bi bi-node-plus"></i>
                                            Avanza stato
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
<html>
